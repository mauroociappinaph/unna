# Render Blueprint for the UNNA staging API (free plan). The database is Supabase and the web runs on
# Vercel (apps/web/vercel.json). Guide: docs/deploy/README.md. Spec: https://render.com/docs/blueprint-spec
# Render generates every token secret (generateValue: random base64, 256 bits), so nobody copies them.
# Values with `sync: false` are asked for only when the Blueprint is first applied.
# Render passes every env var to the Docker build as a build arg (https://render.com/docs/docker);
# the API Dockerfile declares no ARG, so secrets never reach the image.
services:
  - type: web
    name: unna-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Lightweight health check: answers 200 once Nest is listening, without touching the database.
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: UNNA_ENV
        value: staging
      - key: TRUST_PROXY
        value: "1"
      # Supabase Session pooler URL with ?sslmode=require&connection_limit=5&pool_timeout=10 (guide, step 1).
      - key: DATABASE_URL
        sync: false
      # One secret per token type (S21); 256-bit values, so each one is well above the 32-character minimum.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_RESET_SECRET
        generateValue: true
      # generateValue yields exactly 32 bytes in base64, the size this key requires.
      - key: MP_TOKEN_ENCRYPTION_KEY
        generateValue: true
      # Production URL of the Vercel web project (CORS, email links). No trailing slash.
      - key: FRONTEND_URL
        value: https://unna-lovat.vercel.app
      # Any value starting with re_ lets the API start; emails only go out with a real Resend key.
      - key: RESEND_API_KEY
        sync: false
